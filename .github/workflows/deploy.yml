# Publica la aplicación en GitHub Pages.
#
# Requiere un cambio manual una sola vez en el repositorio:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Sin eso el workflow corre pero Pages sigue sirviendo desde la rama.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se permite una sola publicación a la vez; no se cancela una en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `npm run build` regenera los JSON desde index.html y desde el Excel antes de
      # compilar, así lo publicado nunca queda desalineado con las fuentes.
      - name: Compilar
        working-directory: frontend
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
